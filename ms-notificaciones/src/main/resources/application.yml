server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: ms-notificaciones

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        # Antes, si el SMTP fallaba, el mensaje se reencolaba para siempre (ciclo infinito).
        # Ahora: 3 intentos y luego se descarta sin reencolar.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 5s

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

notificaciones:
  email:
    remitente: ${SMTP_USERNAME:pedidos360@no-reply.local}
    destinatario: ${NOTIFICACIONES_EMAIL_DESTINATARIO}
    modo-simulado: ${NOTIFICACIONES_MODO_SIMULADO:false}
  # POST /api/v1/notificaciones/test-email (sin autenticación): apagado por defecto
  test-endpoint:
    enabled: ${NOTIFICACIONES_TEST_ENDPOINT:false}

pedidos360:
  exchange: pedidos360.exchange
  queue:
    notificaciones: pedidos360.notificaciones.queue
  routing-key:
    orden-creada: pedidos360.orden.creada

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
