server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: ms-notificaciones

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

notificaciones:
  email:
    remitente: ${SMTP_USERNAME:pedidos360@no-reply.local}
    modo-simulado: ${NOTIFICACIONES_MODO_SIMULADO:true}

pedidos360:
  exchange: pedidos360.exchange
  queue:
    notificaciones: pedidos360.notificaciones.queue
  routing-key:
    orden-creada: pedidos360.orden.creada

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}