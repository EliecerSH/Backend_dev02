services:

  ms-ordenes:
    image: ${ECR_REGISTRY}/ms-ordenes:latest
    container_name: ecommerce-ms-ordenes
    ports:
      - "8084:8084"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ecommerce-network
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      PRODUCTOS_SERVICE_URL: ${PRODUCTOS_SERVICE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    restart: unless-stopped

  ms-notificaciones:
    image: ${ECR_REGISTRY}/ms-notificaciones:latest
    container_name: ecommerce-ms-notificaciones
    ports:
      - "8085:8085"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ecommerce-network
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      PRODUCTOS_SERVICE_URL: ${PRODUCTOS_SERVICE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    restart: unless-stopped

  ms-auditoria:
    image: ${ECR_REGISTRY}/ms-auditoria:latest
    container_name: ecommerce-ms-auditoria
    ports:
      - "8086:8086"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ecommerce-network
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      PRODUCTOS_SERVICE_URL: ${PRODUCTOS_SERVICE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ecommerce-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  rabbitmq-data:

networks:
  ecommerce-network:
    external: true
    name: ecommerce-network