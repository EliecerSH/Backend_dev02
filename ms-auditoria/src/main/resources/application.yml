server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: ms-auditoria

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI}
          tenant-id: ${AZURE_TENANT_ID}
          client-id: ${AZURE_CLIENT_ID}

  kafka:
    # Broker Kafka en la EC2 de Backend_dev03 (IP privada:9092)
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:ms-auditoria}
      # earliest: al conectarse por primera vez registra también los eventos que ya estaban en el tópico
      auto-offset-reset: earliest
    listener:
      missing-topics-fatal: false

auditoria:
  kafka:
    topic: ${TOPIC_AUDITORIA:auditoria.eventos}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
