server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ms-ordenes

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI}
          tenant-id: ${AZURE_TENANT_ID}
          client-id: ${AZURE_CLIENT_ID}

  kafka:
    # Broker Kafka en la EC2 de Backend_dev03 (IP privada:9092)
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:ms-ordenes}
      auto-offset-reset: earliest
    listener:
      missing-topics-fatal: false

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

services:
  productos:
    # URL base de ms-productos INCLUYENDO /api/v1/productos (precio y stock reales de cada ítem)
    url: ${PRODUCTOS_SERVICE_URL:http://localhost:8082/api/v1/productos}

pedidos360:
  exchange: pedidos360.exchange
  auditoria:
    # Tópico Kafka de auditoría (reemplaza la cola RabbitMQ pedidos360.auditoria.queue)
    topic: ${TOPIC_AUDITORIA:auditoria.eventos}
  routing-key:
    orden-creada: pedidos360.orden.creada
  pagos:
    # true: la orden nace PENDIENTE_PAGO y "orden.creada" (stock + correo) se publica solo cuando
    # ms-pagos informa AUTHORIZED por Kafka. false: comportamiento anterior (sin pasarela de pago).
    requerido: ${PAGO_REQUERIDO:false}
    topic-resultados: ${TOPIC_PAGOS_RESULTADOS:pagos.resultados}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    org.springframework.security: INFO
    org.apache.kafka: WARN
